[package]
name = "crystal-api"
version = "0.0.1"
edition = "2024"
authors = ["purpflow"]

[workspace]
members = ["examples/*"]

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
overflow-checks = true

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
raw-window-handle = "0.6.0"
